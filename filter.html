<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>AMPS Science — Photo Booth</title>
<link rel="preload" as="image" href="img/amps_science_sign_cut.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Archivo+Black&display=swap" rel="stylesheet" />
<style>
  /* Same three colors as menu.html and the printed sticker. */
  :root{
    --cream:  #fff6ec;
    --red:    #ff1a00;
    --yellow: #fdd921;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; overflow:hidden; background:#000; }
  body{
    font-family:"Archivo Black","Helvetica Neue",Impact,system-ui,sans-serif;
    color:var(--cream);
  }

  /* ---------------- live camera ---------------- */
  #cam{
    position:fixed; inset:0; width:100%; height:100%;
    object-fit:cover; z-index:0; background:#000;
  }
  #cam.mirror{ transform:scaleX(-1); }   /* selfie reads like a mirror */

  /* ---------------- the frame (what ends up in the photo) ----------------
     A cream placemat border with a red dotted inner rule, the sticker sign
     pinned top and the diner ribbon pinned bottom — so whoever is in shot
     sits in the clear middle. Every piece here is redrawn onto the capture
     canvas in drawFrame(), so the photo matches the preview. */
  #frame{
    position:fixed; inset:0; z-index:1;
    display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    padding: calc(14px + env(safe-area-inset-top)) 20px calc(150px + env(safe-area-inset-bottom));
    pointer-events:none;
  }

  #border{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    border: 10px solid var(--cream);
  }
  #border::after{
    content:""; position:absolute; inset:3px;
    border: 2px dotted rgba(255,26,0,.75);
  }

  #sign{
    display:block; width:min(58vw, 260px); height:auto;
    filter: drop-shadow(0 6px 12px rgba(0,0,0,.45));
    animation: sway 5s ease-in-out infinite;
  }
  @keyframes sway{
    0%,100%{ transform: translateY(0)    rotate(-.6deg); }
    50%    { transform: translateY(-8px) rotate(.6deg); }
  }

  /* ---------------- MESSI MODE jersey ----------------
     A prop the wearer positions themselves: no pose tracking, just drag it
     onto your torso and pinch it to size. Sits at the same z-index as #frame
     but earlier in the DOM, so the sign, ribbon and border still paint over
     it — and it's the one overlay element that accepts touches. */
  #jersey{
    position:fixed; z-index:1; display:none;
    /* Default lands the collar on the shoulders of someone framed head-and-
       chest. Lower/narrower left a bare neck gap; higher swallowed the chin. */
    left:50%; top:58.5%; width:min(82vw, 350px); height:auto;
    transform:translate(-50%,-50%) scale(1);
    transform-origin:50% 50%;
    filter: drop-shadow(0 8px 16px rgba(0,0,0,.42));
    touch-action:none;            /* we handle drag + pinch ourselves */
    cursor:grab; user-select:none; -webkit-user-drag:none;
  }
  #jersey.on{ display:block; }
  #jersey.grabbing{ cursor:grabbing; }

  /* Transient toast in the clear band between the sign and the torso — the
     bottom of the screen is already full (ribbon, look chips, shutter), and
     at bottom:150px this landed right on the ribbon. Never drawn into the
     capture: it's a UI hint, not part of the photo. */
  #fitHint{
    position:fixed; left:0; right:0; z-index:3; text-align:center;
    top:calc(26vh + env(safe-area-inset-top));
    font-size:10px; letter-spacing:.14em; color:var(--cream);
    text-shadow:0 1px 4px rgba(0,0,0,.9);
    pointer-events:none; opacity:0; transition:opacity .25s ease;
  }
  #fitHint.show{ opacity:.92; }

  #ribbon{
    background:var(--red); color:var(--yellow);
    text-align:center; letter-spacing:.16em;
    font-size: clamp(11px, 3.4vw, 16px);
    padding: 10px 20px; border-radius:999px;
    box-shadow:0 4px 0 rgba(0,0,0,.25);
    white-space:nowrap;
  }

  @media (prefers-reduced-motion: reduce){
    #sign{ animation:none; }
  }

  /* ---------------- look picker ---------------- */
  /* One scrolling row, not flex-wrap: at five looks the chips wrapped onto a
     second line and pushed up into the ribbon. */
  #looks{
    position:fixed; left:0; right:0; z-index:3;
    bottom:calc(108px + env(safe-area-inset-bottom));
    display:flex; gap:7px; padding:0 14px;
    overflow-x:auto; overflow-y:hidden;
    scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  /* Auto-margin spacers instead of justify-content:center — centering a
     scroll container with justify-content makes the first chip unreachable,
     and `safe center` isn't supported widely enough to rely on. Auto margins
     absorb the free space when the chips fit and collapse to 0 when they
     don't, so the row centers or scrolls correctly with no feature checks. */
  #looks::before, #looks::after{ content:""; margin:auto; }
  #looks::-webkit-scrollbar{ display:none; }
  /* Soft edges so a scrolled-off chip reads as "there's more this way"
     rather than as a chip clipped by the screen. */
  #looksWrap{
    position:fixed; left:0; right:0; z-index:3;
    bottom:calc(108px + env(safe-area-inset-bottom));
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 22px,
                        #000 calc(100% - 22px), transparent 100%);
            mask-image: linear-gradient(90deg, transparent 0, #000 22px,
                        #000 calc(100% - 22px), transparent 100%);
  }
  #looksWrap #looks{ position:static; bottom:auto; }
  .look{
    appearance:none; cursor:pointer; flex:0 0 auto; white-space:nowrap;
    /* Tightened from 11px/13px when MESSI MODE became a fifth chip: at the
       old size the row overflowed even a 390px phone. It still scrolls if it
       has to (long labels, small screens), which is why the row is a scroller. */
    font-family:inherit; font-size:10px; letter-spacing:.07em;
    padding:8px 11px; border-radius:999px;
    color:var(--cream); background:rgba(0,0,0,.5);
    border:2px solid rgba(255,246,236,.45);
    backdrop-filter:blur(6px);
  }
  .look.on{
    background:var(--yellow); color:var(--red);
    border-color:var(--red);
  }

  /* ---------------- shutter row ---------------- */
  #controls{
    position:fixed; left:0; right:0; z-index:3;
    bottom:calc(24px + env(safe-area-inset-bottom));
    display:flex; align-items:center; justify-content:center; gap:24px;
  }
  .ctl{
    appearance:none; border:0; cursor:pointer; color:var(--cream); font-weight:800;
    background:rgba(0,0,0,.5); backdrop-filter:blur(6px);
    width:52px; height:52px; border-radius:999px; font-size:21px;
    display:flex; align-items:center; justify-content:center;
  }
  #shot{
    width:72px; height:72px; border-radius:999px; cursor:pointer;
    border:5px solid var(--cream);
    background:var(--red);
    box-shadow:0 6px 18px rgba(255,26,0,.55);
  }

  /* ---------------- tap-to-start gate ----------------
     Mobile browsers only hand over the camera after a user gesture, so the
     booth cannot auto-open; this is the single tap that starts it. */
  #gate{
    position:fixed; inset:0; z-index:6;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; padding:30px; text-align:center;
    background:var(--cream); color:var(--red);
    background-image:
      repeating-linear-gradient(0deg,  rgba(255,26,0,.05) 0 1px, transparent 1px 22px),
      repeating-linear-gradient(90deg, rgba(255,26,0,.05) 0 1px, transparent 1px 22px);
    transition:opacity .45s ease;
  }
  #gate.hide{ opacity:0; pointer-events:none; }
  #gate img{ width:min(78vw,320px); height:auto; }
  #gate h1{
    font-family:"Alfa Slab One",Georgia,Impact,serif; font-weight:400;
    font-size:clamp(22px,7vw,36px); line-height:1; text-transform:uppercase;
    text-shadow:2px 2px 0 var(--cream), 4px 4px 0 rgba(0,0,0,.2);
  }
  #gate p{ max-width:330px; line-height:1.5; font-size:13px; letter-spacing:.04em; }
  #startBtn{
    appearance:none; border:3px solid var(--red); cursor:pointer;
    font-family:inherit; font-size:16px; letter-spacing:.06em;
    padding:16px 28px; border-radius:14px;
    color:var(--red); background:var(--yellow);
    box-shadow:0 5px 0 var(--red);
  }
  #gate small{ font-size:11px; letter-spacing:.1em; opacity:.75; min-height:15px; }
  #gate a{ color:var(--red); font-size:11px; letter-spacing:.1em; }

  /* ---------------- photo preview ---------------- */
  #photoView{
    position:fixed; inset:0; z-index:7; display:none;
    flex-direction:column; align-items:center; justify-content:center; gap:14px;
    background:rgba(20,8,4,.94); padding:22px;
  }
  #photoView.show{ display:flex; }
  #photoView img{
    max-width:92%; max-height:62vh; border-radius:8px;
    box-shadow:0 12px 40px rgba(0,0,0,.6);
  }
  #photoView .row{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .pbtn{
    appearance:none; border:0; cursor:pointer;
    font-family:inherit; font-size:14px; letter-spacing:.06em;
    padding:13px 22px; border-radius:12px;
    color:var(--red); background:var(--yellow);
    box-shadow:0 4px 0 rgba(0,0,0,.3);
  }
  .pbtn.secondary{
    background:transparent; color:var(--cream);
    border:2px solid rgba(255,246,236,.5); box-shadow:none;
  }
  #photoHint{
    color:var(--cream); font-size:11px; letter-spacing:.08em;
    text-align:center; max-width:330px; line-height:1.6; min-height:15px;
  }

  #flash{ position:fixed; inset:0; z-index:8; background:#fff; opacity:0; pointer-events:none; }
  #flash.fire{ animation:flash .35s ease-out; }
  @keyframes flash{ 0%{opacity:.9;} 100%{opacity:0;} }
</style>
</head>
<body>

  <video id="cam" playsinline muted autoplay></video>

  <!-- MESSI MODE: drag/pinch onto your torso. Before #frame so the sign and
       ribbon stay on top of it. -->
  <img id="jersey" src="img/jersey_messi.png" alt="Messi 10 jersey"
       crossorigin="anonymous" draggable="false" />
  <div id="fitHint">DRAG TO PLACE &nbsp;&middot;&nbsp; PINCH TO SIZE</div>

  <!-- frame: sign top, ribbon bottom, subject in the clear middle -->
  <div id="frame">
    <img id="sign" src="img/amps_science_sign_cut.png"
         alt="AMPS Science — 99% Science 1% Magic" crossorigin="anonymous" />
    <div id="ribbon">NYC OFFSITE 2026</div>
  </div>
  <div id="border"></div>

  <!-- the actual photo filters: scrolling row, faded at both edges -->
  <div id="looksWrap"><div id="looks"></div></div>

  <div id="controls">
    <button class="ctl" id="flip" title="Flip camera">&#128260;</button>
    <button id="shot" title="Take photo"></button>
    <button class="ctl" id="close" title="Close" style="font-size:19px;">&#10005;</button>
  </div>

  <div id="gate">
    <img src="img/amps_science_sign_cut.png" alt="AMPS Science" />
    <h1>Photo Booth</h1>
    <p>Grab a shot any time this week &mdash; pick a look, strike a pose, then share it with the team.</p>
    <button id="startBtn">&#128247; OPEN THE BOOTH</button>
    <small id="gateMsg"></small>
    <a href="menu.html">&larr; back to the menu</a>
  </div>

  <div id="photoView">
    <img id="photoImg" alt="Your photo" />
    <div class="row">
      <button class="pbtn" id="photoShare">SHARE / SAVE</button>
      <button class="pbtn secondary" id="photoClose">RETAKE</button>
    </div>
    <div id="photoHint"></div>
  </div>

  <div id="flash"></div>

<script>
(function(){
  "use strict";

  const CREAM = "#fff6ec", RED = "#ff1a00", YELLOW = "#fdd921";
  const $ = id => document.getElementById(id);
  const camVideo = $("cam"), gate = $("gate"), photoView = $("photoView"),
        photoImg = $("photoImg"), flash = $("flash"), signImg = $("sign"),
        jersey = $("jersey"), fitHint = $("fitHint");

  /* ------------------------------------------------------------------
     THE LOOKS.

     css: a CSS filter string, applied to the <video> for live preview and
          re-implemented in pixel math by gradeCanvas() on capture so the
          saved photo matches what was on screen.
     prop: optional — turns on the draggable jersey overlay. Not a color
          grade, so it rides along as its own element rather than going
          through the filter chain.

     Five chips overflow a 360-390px phone, so the row scrolls — which is why
     MESSI MODE is listed FIRST: at the far end it would start off-screen and
     most people would never scroll to find it. `start:true` marks the look the
     booth OPENS on, so display order and default are independent.
     ------------------------------------------------------------------ */
  const LOOKS = [
    /* The joke: Messi in a Real Madrid shirt. Grade is a light warm punch so
       the white kit doesn't clip. */
    { id:"messi",  name:"MESSI MODE",  css:"saturate(1.25) contrast(1.08)", prop:"jersey" },
    { id:"diner",  name:"DINER",       css:"saturate(1.45) contrast(1.12) sepia(.22) brightness(1.04)",
      start:true },
    /* Tuned down from saturate(2.3) contrast(1.75): the stronger version
       turned skin orange and blew out highlights on real faces. */
    { id:"print",  name:"POSTER",      css:"saturate(1.85) contrast(1.28)" },
    { id:"classic",name:"CLASSIC",     css:"none" },
    { id:"noir",   name:"NOIR",        css:"grayscale(1) contrast(1.35) brightness(1.03)" }
  ];
  let look = LOOKS.find(l => l.start) || LOOKS[0];

  (function buildLooks(){
    const wrap = $("looks");
    LOOKS.forEach(l => {
      const b = document.createElement("button");
      b.className = "look" + (l === look ? " on" : "");
      b.textContent = l.name;
      b.dataset.id = l.id;
      b.addEventListener("click", () => setLook(l));
      wrap.appendChild(b);
    });
  })();

  function setLook(l){
    look = l;
    camVideo.style.filter = (l.css === "none") ? "" : l.css;
    document.querySelectorAll(".look").forEach(b =>
      b.classList.toggle("on", b.dataset.id === l.id));

    const wearing = l.prop === "jersey";
    jersey.classList.toggle("on", wearing);
    // flash the fit instructions each time the prop comes on, then fade out
    fitHint.classList.toggle("show", wearing);
    if(wearing){
      clearTimeout(hintTimer);
      hintTimer = setTimeout(()=> fitHint.classList.remove("show"), 3200);
    }
  }
  let hintTimer = 0;

  /* ---------------- placing the jersey ----------------
     No pose model: the wearer drags it onto themselves and pinches it to
     size, which is both far lighter than segmentation and funnier, since
     nobody lines it up quite right. State lives here (not in the CSS) so
     the capture canvas can read the exact same numbers. */
  const fit = { x:0, y:0, scale:1 };   // x/y are CSS-px offsets from the base position

  function applyFit(){
    jersey.style.transform =
      "translate(-50%,-50%) translate(" + fit.x + "px," + fit.y + "px) scale(" + fit.scale + ")";
  }
  applyFit();

  const pointers = new Map();
  let dragStart = null;

  function pinchSpan(){
    const p = [...pointers.values()];
    return Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
  }
  function pinchMid(){
    const p = [...pointers.values()];
    return { x:(p[0].x + p[1].x)/2, y:(p[0].y + p[1].y)/2 };
  }

  jersey.addEventListener("pointerdown", e => {
    jersey.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
    jersey.classList.add("grabbing");
    if(pointers.size === 1){
      dragStart = { px:e.clientX, py:e.clientY, x:fit.x, y:fit.y };
    }else if(pointers.size === 2){
      dragStart = { span:pinchSpan(), scale:fit.scale,
                    mid:pinchMid(), x:fit.x, y:fit.y };
    }
    e.preventDefault();
  });

  jersey.addEventListener("pointermove", e => {
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if(pointers.size === 1 && dragStart && dragStart.px !== undefined){
      fit.x = dragStart.x + (e.clientX - dragStart.px);
      fit.y = dragStart.y + (e.clientY - dragStart.py);
    }else if(pointers.size === 2 && dragStart && dragStart.span){
      const span = pinchSpan();
      fit.scale = Math.max(0.4, Math.min(2.6,
        dragStart.scale * (span / dragStart.span)));
      // follow the midpoint too, so a two-finger move still pans
      const mid = pinchMid();
      fit.x = dragStart.x + (mid.x - dragStart.mid.x);
      fit.y = dragStart.y + (mid.y - dragStart.mid.y);
    }
    applyFit();
    e.preventDefault();
  });

  function endPointer(e){
    pointers.delete(e.pointerId);
    if(pointers.size === 0){
      jersey.classList.remove("grabbing");
      dragStart = null;
    }else if(pointers.size === 1){
      // lifting one finger of a pinch: re-seat the drag origin or the jersey
      // jumps by the gap between the old midpoint and the remaining finger
      const p = [...pointers.values()][0];
      dragStart = { px:p.x, py:p.y, x:fit.x, y:fit.y };
    }
  }
  jersey.addEventListener("pointerup", endPointer);
  jersey.addEventListener("pointercancel", endPointer);

  // double-tap the jersey to reset a badly mangled fit
  jersey.addEventListener("dblclick", () => {
    fit.x = 0; fit.y = 0; fit.scale = 1; applyFit();
  });

  setLook(look);

  // ---------------- camera ----------------
  let camFacing = "user";   // open in selfie mode
  async function startCamera(facing){
    camFacing = facing || camFacing;
    if(camVideo.srcObject){
      camVideo.srcObject.getTracks().forEach(t => t.stop());
      camVideo.srcObject = null;
    }
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ ideal: camFacing } }, audio:false
    });
    camVideo.srcObject = stream;
    camVideo.classList.toggle("mirror", camFacing === "user");
    await camVideo.play().catch(()=>{});
  }

  let flipping = false;
  async function flipCamera(){
    if(flipping) return;
    flipping = true;
    try{ await startCamera(camFacing === "user" ? "environment" : "user"); }
    catch(_){ /* stay on the current camera */ }
    flipping = false;
  }

  async function launch(){
    $("gateMsg").textContent = "Opening the camera…";
    try{
      await startCamera("user");
      gate.classList.add("hide");
      $("gateMsg").textContent = "";
    }catch(err){
      $("gateMsg").textContent = "Couldn't open the camera — check permissions and tap again.";
    }
  }

  /* ------------------------------------------------------------------
     GRADING THE CAPTURE.

     ctx.filter can't be relied on: iOS Safari only shipped it in 18, and
     where it's missing an unsupported assignment is silently ignored — so
     the photo came out ungraded with no error. Feature-detecting it is no
     help either ("filter" in ctx is true for no-op implementations).

     So the same filter chain is applied here in pixel math instead, per the
     Filter Effects spec: each function in order, on non-linear sRGB,
     clamped between steps — which is what the CSS preview on the <video>
     is doing. One pass over the frame, every browser, identical result.
     ------------------------------------------------------------------ */
  function satMatrix(s){
    return [0.213+0.787*s, 0.715-0.715*s, 0.072-0.072*s,
            0.213-0.213*s, 0.715+0.285*s, 0.072-0.072*s,
            0.213-0.213*s, 0.715-0.715*s, 0.072+0.928*s];
  }
  function sepiaMatrix(v){
    const k = 1-v;
    return [0.393+0.607*k, 0.769-0.769*k, 0.189-0.189*k,
            0.349-0.349*k, 0.686+0.314*k, 0.168-0.168*k,
            0.272-0.272*k, 0.534-0.534*k, 0.131+0.869*k];
  }
  function hueMatrix(deg){
    const r = deg*Math.PI/180, c = Math.cos(r), s = Math.sin(r);
    return [0.213+c*0.787-s*0.213, 0.715-c*0.715-s*0.715, 0.072-c*0.072+s*0.928,
            0.213-c*0.213+s*0.143, 0.715+c*0.285+s*0.140, 0.072-c*0.072-s*0.283,
            0.213-c*0.213-s*0.787, 0.715-c*0.715+s*0.715, 0.072+c*0.928+s*0.072];
  }

  // "saturate(1.45) contrast(1.12)" -> [{matrix|scale|linear}, ...]
  function parseFilter(css){
    const ops = [];
    if(!css || css === "none") return ops;
    const re = /([a-z-]+)\(([^)]+)\)/g;
    let m;
    while((m = re.exec(css))){
      const fn = m[1], v = parseFloat(m[2]);
      if(fn === "saturate")        ops.push({ t:"m", m:satMatrix(v) });
      else if(fn === "grayscale")  ops.push({ t:"m", m:satMatrix(1-v) });
      else if(fn === "sepia")      ops.push({ t:"m", m:sepiaMatrix(v) });
      else if(fn === "hue-rotate") ops.push({ t:"m", m:hueMatrix(v) });
      else if(fn === "brightness") ops.push({ t:"l", a:v, b:0 });
      else if(fn === "contrast")   ops.push({ t:"l", a:v, b:255*(0.5-0.5*v) });
    }
    return ops;
  }

  function gradeCanvas(ctx, W, H, css){
    const ops = parseFilter(css);
    if(!ops.length) return;
    const img = ctx.getImageData(0, 0, W, H);
    const d = img.data;
    for(let i = 0; i < d.length; i += 4){
      let r = d[i], g = d[i+1], b = d[i+2];
      for(let o = 0; o < ops.length; o++){
        const op = ops[o];
        if(op.t === "m"){
          const k = op.m;
          const nr = r*k[0] + g*k[1] + b*k[2];
          const ng = r*k[3] + g*k[4] + b*k[5];
          const nb = r*k[6] + g*k[7] + b*k[8];
          r = nr; g = ng; b = nb;
        }else{
          r = r*op.a + op.b; g = g*op.a + op.b; b = b*op.a + op.b;
        }
        r = r < 0 ? 0 : r > 255 ? 255 : r;
        g = g < 0 ? 0 : g > 255 ? 255 : g;
        b = b < 0 ? 0 : b > 255 ? 255 : b;
      }
      d[i] = r; d[i+1] = g; d[i+2] = b;
    }
    ctx.putImageData(img, 0, 0);
  }

  // ---------------- capture ----------------
  let lastBlob = null;

  // object-fit:cover, done by hand so the photo frames like the preview
  function drawCover(ctx, video, W, H, mirror){
    const vw = video.videoWidth, vh = video.videoHeight;
    if(!vw || !vh){ ctx.fillStyle = "#100704"; ctx.fillRect(0,0,W,H); return; }
    const scale = Math.max(W/vw, H/vh);
    const dw = vw*scale, dh = vh*scale;
    ctx.save();
    if(mirror){ ctx.translate(W,0); ctx.scale(-1,1); }
    ctx.drawImage(video, (W-dw)/2, (H-dh)/2, dw, dh);
    ctx.restore();
  }

  function roundRect(ctx, x, y, w, h, r){
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y,   x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x,   y+h, r);
    ctx.arcTo(x,   y+h, x,   y,   r);
    ctx.arcTo(x,   y,   x+w, y,   r);
    ctx.closePath();
  }

  // The ribbon is CSS (rounded pill + letter-spaced text), so it has to be
  // redrawn rather than copied — positioned from its on-screen rect.
  function drawRibbon(ctx, sx, sy){
    const el = $("ribbon"), r = el.getBoundingClientRect();
    if(r.width <= 0) return;
    const x = r.left*sx, y = r.top*sy, w = r.width*sx, h = r.height*sy;
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,.25)";
    roundRect(ctx, x, y + 4*sy, w, h, h/2); ctx.fill();
    ctx.fillStyle = RED;
    roundRect(ctx, x, y, w, h, h/2); ctx.fill();

    const fs = parseFloat(getComputedStyle(el).fontSize) * sy;
    ctx.fillStyle = YELLOW;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = '400 ' + fs + 'px "Archivo Black", Impact, sans-serif';
    drawSpaced(ctx, el.textContent.trim().replace(/\s+/g," "),
               x + w/2, y + h/2, fs*0.16);
    ctx.restore();
  }

  // canvas has no letter-spacing, and the ribbon's .16em tracking is a big
  // part of the diner look — so space the glyphs manually.
  function drawSpaced(ctx, text, cx, cy, extra){
    const chars = [...text];
    let total = 0;
    chars.forEach(c => { total += ctx.measureText(c).width + extra; });
    total -= extra;
    let x = cx - total/2;
    ctx.textAlign = "left";
    chars.forEach(c => {
      ctx.fillText(c, x, cy);
      x += ctx.measureText(c).width + extra;
    });
    ctx.textAlign = "center";
  }

  function drawBorder(ctx, W, H, sx, sy){
    const bw = 10*sx, inset = 3*sx;
    ctx.save();
    ctx.fillStyle = CREAM;
    ctx.fillRect(0,0,W,bw); ctx.fillRect(0,H-bw,W,bw);
    ctx.fillRect(0,0,bw,H); ctx.fillRect(W-bw,0,bw,H);
    ctx.strokeStyle = "rgba(255,26,0,.75)";
    ctx.lineWidth = 2*sx;
    ctx.setLineDash([4*sx, 4*sx]);
    ctx.strokeRect(inset, inset, W-inset*2, H-inset*2);
    ctx.restore();
  }

  /* The jersey is only translated and scaled — never rotated — so its
     bounding rect IS its visual box, and one drawImage reproduces exactly
     what's on screen. Drawn after the grade (it's a prop, not part of the
     photo) and before the frame (the sign still sits on top). */
  function drawJersey(ctx, sx, sy){
    if(!jersey.classList.contains("on")) return;
    if(!jersey.complete || !jersey.naturalWidth) return;
    const r = jersey.getBoundingClientRect();
    if(r.width <= 0) return;
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,.42)";
    ctx.shadowBlur = 16*sx;
    ctx.shadowOffsetY = 8*sy;
    ctx.drawImage(jersey, r.left*sx, r.top*sy, r.width*sx, r.height*sy);
    ctx.restore();
  }

  function drawFrame(ctx, W, H){
    const sx = W/window.innerWidth, sy = H/window.innerHeight;
    // no ctx.filter reset needed: grading already ran as a pixel pass
    if(signImg.complete && signImg.naturalWidth){
      const r = signImg.getBoundingClientRect();
      if(r.width > 0) ctx.drawImage(signImg, r.left*sx, r.top*sy, r.width*sx, r.height*sy);
    }
    drawRibbon(ctx, sx, sy);
    drawBorder(ctx, W, H, sx, sy);
  }

  async function takePhoto(){
    // wait for Archivo Black, or the ribbon text falls back mid-draw
    if(document.fonts && document.fonts.ready){ try{ await document.fonts.ready; }catch(_){} }

    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = Math.round(window.innerWidth * dpr);
    const H = Math.round(window.innerHeight * dpr);
    const out = document.createElement("canvas");
    out.width = W; out.height = H;
    const ctx = out.getContext("2d");

    // Camera frame first, then grade it, THEN lay the frame on top — so the
    // sign and ribbon keep their exact brand colors while the photo behind
    // them takes the look.
    drawCover(ctx, camVideo, W, H, camVideo.classList.contains("mirror"));
    gradeCanvas(ctx, W, H, look.css);
    drawJersey(ctx, W/window.innerWidth, H/window.innerHeight);
    drawFrame(ctx, W, H);

    flash.classList.remove("fire"); void flash.offsetWidth; flash.classList.add("fire");

    lastBlob = await new Promise(res => out.toBlob(res, "image/png"));
    photoImg.src = URL.createObjectURL(lastBlob);
    $("photoHint").textContent = "Share it with the team, or save it and send it over.";
    photoView.classList.add("show");
  }

  async function sharePhoto(){
    if(!lastBlob) return;
    const name = "amps-science-" + look.id + ".png";
    const file = new File([lastBlob], name, { type:"image/png" });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      try{ await navigator.share({ files:[file], title:"AMPS Science Photo Booth" }); return; }
      catch(_){ /* cancelled — fall through to a download */ }
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(lastBlob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    $("photoHint").textContent = "Saved to your downloads.";
  }

  function closeBooth(){
    if(camVideo.srcObject){
      camVideo.srcObject.getTracks().forEach(t => t.stop());
      camVideo.srcObject = null;
    }
    photoView.classList.remove("show");
    gate.classList.remove("hide");
  }

  $("startBtn").addEventListener("click", launch);
  $("flip").addEventListener("click", flipCamera);
  $("shot").addEventListener("click", takePhoto);
  $("close").addEventListener("click", closeBooth);
  $("photoShare").addEventListener("click", sharePhoto);
  $("photoClose").addEventListener("click", ()=> photoView.classList.remove("show"));
})();
</script>
</body>
</html>
