<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AMPS Science</title>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }

  body{
    background: radial-gradient(circle at 50% 25%, #1c1c1c 0%, #050505 90%);
    min-height:100dvh;               /* dvh = true visible height on mobile */
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
    overflow-y:auto;                 /* scroll instead of clip if too short */
    position:relative;
    font-family:system-ui,sans-serif;
  }
  /* Title + names grouped and centered together. margin:auto centers the
     group when there's room, and lets it scroll from the top when not. */
  .stagecard{
    margin:auto;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: 5vh;
    padding: 6vh 16px;
  }

  .word{ display:flex; align-items:flex-end; justify-content:center; }
  .word img{ display:block; height:100%; width:auto; }

  /* ---------- TITLE ---------- */
  .title{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 1.2vh;
    animation: floaty 4.5s ease-in-out infinite;
    filter: drop-shadow(0 16px 20px rgba(0,0,0,.55));
  }
  .title .word{ height: clamp(56px, 13vw, 132px); }
  .title .word img{ margin: 0 -0.6vw; }

  @keyframes floaty{
    0%,100%{ transform: translateY(0) rotate(-.5deg); }
    50%    { transform: translateY(-14px) rotate(.5deg); }
  }

  /* ---------- RISING NAMES ---------- */
  .stage{
    height: clamp(90px, 18dvh, 150px);
    width:100%;
    display:flex; align-items:flex-end; justify-content:center;
    position:relative;
  }
  /* soft pink glow that fades in behind the risen name */
  .glow{
    position:absolute;
    bottom:-4%;
    left:50%;
    width:70%;
    height:120%;
    transform:translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(255,120,190,.42) 0%, rgba(255,120,190,0) 70%);
    opacity:0;
    transition: opacity 1.2s ease;
    pointer-events:none;
    filter: blur(6px);
  }
  .glow.on{ opacity:1; }

  .name{
    position:absolute;
    bottom:0;
    height:100%;
    display:flex; align-items:flex-end; justify-content:center;
    filter: drop-shadow(0 14px 16px rgba(0,0,0,.5));
  }
  /* whole-name gentle float. Starts from the exact resting state
     (translateY 0, no rotation) so there's no snap when it begins. */
  .name.floating{ animation: nameBob 4.2s ease-in-out infinite; }
  @keyframes nameBob{
    0%   { transform: translateY(0)     rotate(0deg); }
    50%  { transform: translateY(-12px) rotate(.4deg); }
    100% { transform: translateY(0)     rotate(0deg); }
  }

  /* each letter is positioned/faded individually via inline styles from JS. */
  .name img{
    display:block;
    height:100%;
    width:auto;
    margin: 0 -0.5vw;
    opacity:0;
    transform: translateY(220%);
    transition-property: opacity, transform;
    transition-timing-function: cubic-bezier(.16,.68,.3,1);
    will-change: transform, opacity;
  }

  /* ---------- ROSTER SPLASH (shows first, every load) ---------- */
  .rosterSplash{
    position:fixed; inset:0; z-index:20;
    background: radial-gradient(circle at 50% 20%, #1c1c1c 0%, #050505 90%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 2.2vh;
    padding: 4vh 12px;
    opacity:1;
    transition: opacity 1s ease;
  }
  .rosterSplash.hide{ opacity:0; pointer-events:none; }
  /* balloon-letter logo on the roster splash (mirrors the main .title) */
  .rlogo{
    display:flex; flex-direction:column; align-items:center;
    gap: 0.8vh;
    animation: floaty 4.5s ease-in-out infinite;
    filter: drop-shadow(0 12px 16px rgba(0,0,0,.55));
  }
  .rlogo .word{ height: clamp(38px, 9vw, 78px); }
  .rlogo .word img{ margin: 0 -0.6vw; display:block; height:100%; width:auto; }

  /* ---- Executive Team section (sits above the main roster grid) ---- */
  .execwrap{
    display:flex; flex-direction:column; align-items:center; gap: 1vh;
    width:100%;
  }
  .execlabel{
    font-family:"Baloo 2","Nunito",system-ui,sans-serif;
    font-weight:800; letter-spacing:.18em; text-transform:uppercase;
    font-size: clamp(11px, 3vw, 16px);
    color:#ffd6ea;
    display:flex; align-items:center; gap:10px;
  }
  /* little pink dividers flanking the label */
  .execlabel::before, .execlabel::after{
    content:""; height:2px; width: clamp(22px, 8vw, 54px);
    background:linear-gradient(90deg, rgba(255,158,203,0), rgba(255,158,203,.9));
    border-radius:2px;
  }
  .execlabel::after{ transform:rotate(180deg); }
  /* Science Team label reuses the exec label styling, with a little breathing room */
  .scilabel{ margin-bottom: 0.4vh; }
  .execgrid{
    display:flex; justify-content:center; align-items:flex-end;
    gap: 6vw; flex-wrap:wrap;
  }
  /* exec names float like the roster names, sized a touch larger */
  .execgrid .rname{ --rh: clamp(30px, 8vw, 62px); }
  /* thin separator under the exec section */
  .execdiv{
    width: min(60%, 340px); height:2px; border-radius:2px;
    background:linear-gradient(90deg, rgba(255,158,203,0), rgba(255,158,203,.5), rgba(255,158,203,0));
    margin: 0.4vh 0 0.6vh;
  }
  .rgrid{
    display:grid;
    grid-template-columns: 1fr 1fr;      /* two columns */
    align-items:center;
    justify-items:center;
    column-gap: 4vw;
    row-gap: 1.4vh;
    width:100%;
    max-width: 560px;
  }
  /* hold all roster animations until images are ready, then release in sync */
  .rgrid.paused .rname,
  .rgrid.paused .rname img,
  .execgrid.paused .rname,
  .execgrid.paused .rname img{ animation-play-state: paused; }
  .rname{
    display:flex; align-items:flex-end; justify-content:center;
    height: var(--rh, 34px);             /* set by JS to fit */
    filter: drop-shadow(0 6px 7px rgba(0,0,0,.5));
    /* the whole name bobs, but only AFTER its letters finish rising.
       --bobDelay is set inline by JS so the bob starts post-rise. */
    animation: rbob 4s ease-in-out infinite;
    animation-delay: var(--bobDelay, 0s);
    will-change: transform;
  }
  @keyframes rbob{
    0%,100%{ transform: translateY(0) rotate(-.4deg); }
    50%    { transform: translateY(-7px) rotate(.4deg); }
  }

  /* each letter floats up once on entry; per-letter delay set inline by JS.
     Pure CSS so 150 letters animate smoothly without JS orchestration. */
  .rname img{
    display:block; height:100%; width:auto; margin:0 -0.4vw;
    opacity:0;
    transform: translateY(200%) scale(.9);
    /* slow, buoyant, near-constant drift (same easing as single-name rise) */
    animation: rRise 3.2s cubic-bezier(.33,.15,.5,1) forwards;
    animation-delay: var(--riseDelay, 0s);
    will-change: transform, opacity;
  }
  @keyframes rRise{
    0%   { opacity:0; transform: translateY(200%) scale(.9); }
    40%  { opacity:1; }
    100% { opacity:1; transform: translateY(0) scale(1); }
  }

  /* ---------- FINALE "WHOLE TEAM" FRAME ---------- */
  .finale{
    position:fixed;
    inset:0;
    z-index:10;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: 3vh;
    padding: 6vh 6vw;
    opacity:0;
    pointer-events:none;
    transition: opacity 1s ease, transform 1s ease;
    transform: scale(.96);
  }
  .finale.on{ opacity:1; transform: scale(1); }
  .finale h2{
    font-family:"Baloo 2","Nunito",system-ui,sans-serif;
    font-weight:800;
    font-size: clamp(26px, 6vw, 60px);
    letter-spacing:.04em;
    color:#ff9ecb;
    text-shadow: 0 0 18px rgba(255,120,190,.55), 0 6px 14px rgba(0,0,0,.5);
  }
  .finale .roster{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap: 1.1vh 1.6vw;
    max-width: 900px;
  }
  .finale .chip{
    font-family:"Baloo 2","Nunito",system-ui,sans-serif;
    font-weight:800;
    font-size: clamp(16px, 2.4vw, 30px);
    color:#ffd6ea;
    background: linear-gradient(178deg,#ff9ecb 0%,#f25c9c 100%);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    filter: drop-shadow(0 3px 5px rgba(0,0,0,.4));
    opacity:0;
    transform: translateY(16px);
    transition: opacity .5s ease, transform .6s cubic-bezier(.16,.68,.3,1);
  }
  .finale.on .chip{ opacity:1; transform: translateY(0); }
</style>
</head>
<body>

  <!-- Roster splash: shown on every load, then fades into the cycling show -->
  <div class="rosterSplash" id="rosterSplash">
    <!-- balloon-letter logo, same as the main title -->
    <div class="rlogo" id="rlogo">
      <div class="word" id="rw1"></div>
      <div class="word" id="rw2"></div>
    </div>
    <!-- Executive team, called out above the main roster -->
    <div class="execwrap" id="execwrap">
      <div class="execlabel">Executive Team</div>
      <div class="execgrid paused" id="execgrid"></div>
      <div class="execdiv"></div>
    </div>
    <!-- Science team label above the roster grid -->
    <div class="execlabel scilabel">Science Team</div>
    <div class="rgrid paused" id="rgrid"></div>
  </div>

  <div class="stagecard">
    <!-- Title -->
    <div class="title">
      <div class="word" id="w1"></div>
      <div class="word" id="w2"></div>
    </div>

    <!-- Rising names -->
    <div class="stage" id="stage">
      <div class="glow" id="glow"></div>
      <div class="finale" id="finale"></div>
    </div>
  </div>

<script>
  const DIR = "letters/";
  const names = [
    "alexijia","amdhanda","achanish","boopalb","bverkhov","nevina",
    "elcimren","gcwong","jmanas","kriswpan","kynovak","meisamhe",
    "mozadeh","rninad","pstudans","rpothen","rzmiao","devadula",
    "saniaki","ssamaga","khatrivi"
  ];
  const execs = ["benjamwy","myan"];   // executive team, shown above the roster

  // ---- timing (ms) ----
  const RISE_DUR    = 3800;   // slow, floaty rise per letter (balloon drift)
  const RISE_SPREAD = 1800;   // random rise delays spread across this window
  const HOLD        = 2600;   // fully risen + gently bobbing
  const FADE_DUR    = 1600;   // fade away in place
  const FADE_SPREAD = 1200;   // random fade delays
  const GAP         = 500;    // blank pause before next name
  const FINALE_HOLD = 4200;   // how long the whole-team frame stays up

  const RISE_EASE = "cubic-bezier(.33,.15,.5,1)"; // buoyant, near-constant drift

  const rand = (a,b)=> a + Math.random()*(b-a);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const shuffle = arr => {                 // Fisher–Yates
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  };

  function buildWord(text){
    const frag = document.createDocumentFragment();
    for(const ch of text.toUpperCase()){
      const img = document.createElement("img");
      img.src = DIR + ch + ".png";
      img.alt = ch;
      frag.appendChild(img);
    }
    return frag;
  }

  // Title
  document.getElementById("w1").appendChild(buildWord("AMPS"));
  document.getElementById("w2").appendChild(buildWord("SCIENCE"));

  // One .name element per name
  const stage  = document.getElementById("stage");
  const glow   = document.getElementById("glow");
  const finale = document.getElementById("finale");

  const els = names.map(n => {
    const el = document.createElement("div");
    el.className = "name";
    el.appendChild(buildWord(n));
    stage.appendChild(el);
    return el;
  });

  // Build the finale roster once
  (function buildFinale(){
    const h = document.createElement("h2");
    h.textContent = "AMPS Science ♡";
    const roster = document.createElement("div");
    roster.className = "roster";
    names.forEach(n=>{
      const c = document.createElement("span");
      c.className = "chip";
      c.textContent = n;
      roster.appendChild(c);
    });
    finale.appendChild(h);
    finale.appendChild(roster);
  })();

  function resetLetter(img){
    img.style.transition = "none";
    img.style.opacity = "0";
    img._wob  = rand(-22, 22);        // sideways drift
    img._tilt = rand(-7, 7);          // organic resting tilt (deg)
    img.style.transform = `translate(${img._wob}px, 220%) rotate(${img._tilt}deg)`;
  }

  async function runName(el){
    const letters = [...el.querySelectorAll("img")];

    // prep hidden state
    letters.forEach(resetLetter);
    void el.offsetWidth;

    // rise: random order, slow buoyant drift, settle with a slight tilt
    letters.forEach(img=>{
      const delay = rand(0, RISE_SPREAD);
      img.style.transition = `opacity ${RISE_DUR*0.4}ms ease, transform ${RISE_DUR}ms ${RISE_EASE}`;
      img.style.transitionDelay = delay + "ms";
      img.style.opacity = "1";
      img.style.transform = `translate(0px, 0px) rotate(${img._tilt*0.5}deg)`;
    });
    await sleep(RISE_SPREAD + RISE_DUR);

    // name is fully formed -> glow ramps in, then hold + lazy bob
    glow.classList.add("on");
    el.classList.add("floating");
    await sleep(HOLD);

    // Fade away while the name KEEPS gently floating (don't stop the bob here,
    // or it snaps to rest and stutters). glow fades out with the letters.
    glow.classList.remove("on");
    letters.forEach(img=>{
      const delay = rand(0, FADE_SPREAD);
      img.style.transition = `opacity ${FADE_DUR}ms ease, transform ${FADE_DUR}ms ease-in`;
      img.style.transitionDelay = delay + "ms";
      img.style.opacity = "0";
      img.style.transform = `translate(${img._wob*0.5}px, -18%) scale(.96) rotate(${img._tilt}deg)`;
    });
    await sleep(FADE_SPREAD + FADE_DUR);

    // now fully invisible -> safe to stop the bob (any reset snap is unseen)
    el.classList.remove("floating");
    void el.offsetWidth;
  }

  async function showFinale(){
    finale.classList.add("on");
    await sleep(FINALE_HOLD);
    finale.classList.remove("on");
    await sleep(1000);
  }

  async function loop(){
    while(true){
      const order = shuffle(names.map((_,i)=>i));   // fresh order each cycle
      for(const idx of order){
        await runName(els[idx]);
        await sleep(GAP);
      }
      await showFinale();                            // whole-team payoff
    }
  }

  // --- FIT NAMES TO SCREEN WIDTH ---------------------------------------
  // Letters are sized by height, so a long name can be wider than a narrow
  // phone screen and get clipped. Measure the widest name and shrink ALL
  // names to one uniform height so even the longest fits (with a margin).
  function fitNames(){
    const avail = stage.clientWidth * 0.9;   // leave a little side margin
    const full  = stage.clientHeight;
    els.forEach(el => el.style.height = full + "px");   // reset to measure
    let maxW = 0;
    els.forEach(el => { if (el.scrollWidth > maxW) maxW = el.scrollWidth; });
    const h = (maxW > avail) ? Math.floor(full * avail / maxW) : full;
    els.forEach(el => el.style.height = h + "px");
  }

  // ---- ROSTER SPLASH (two columns, all names, gentle float) ----
  const rosterSplash = document.getElementById("rosterSplash");
  const rgrid = document.getElementById("rgrid");
  const execgrid = document.getElementById("execgrid");
  // roster must stay up long enough for the last name to finish rising:
  // last name starts ~ 20*0.35s=7s, + 1.4s spread + 3.2s rise ≈ 11.6s, then linger
  const SPLASH_HOLD = 27000;  // ms the roster stays before fading into the show

  const ROW_STAGGER  = 0.35;   // s between successive names starting to rise
  const LETTER_SPREAD= 1.4;    // s window over which a name's letters rise (RANDOM within)
  const RISE_LEN     = 3.2;    // s for a letter's rise (matches CSS)

  // balloon-letter logo on the splash
  document.getElementById("rw1").appendChild(buildWord("AMPS"));
  document.getElementById("rw2").appendChild(buildWord("SCIENCE"));

  // Build a floating name row into a grid, with rise delays offset by `startAt`
  // seconds so sections can rise in sequence (execs first, then the roster).
  function buildNameRow(grid, name, indexInSection, startAt){
    const el=document.createElement("div");
    el.className="rname";
    el.appendChild(buildWord(name));
    const letters=[...el.querySelectorAll("img")];
    const nameStart = startAt + indexInSection*ROW_STAGGER;
    letters.forEach(img=>{
      const d = nameStart + Math.random()*LETTER_SPREAD;   // random per letter
      img.style.setProperty("--riseDelay", d.toFixed(2)+"s");
    });
    // bob starts after the whole name could be up (worst-case last letter)
    const bobStart = nameStart + LETTER_SPREAD + RISE_LEN;
    el.style.setProperty("--bobDelay", bobStart.toFixed(2)+"s");
    grid.appendChild(el);
  }

  // Executives rise first (they sit on top), then the roster follows.
  (function buildExec(){
    execs.forEach((n,i)=> buildNameRow(execgrid, n, i, 0));
  })();
  const EXEC_LEAD = execs.length*ROW_STAGGER + 0.4;   // roster starts after execs
  (function buildRoster(){
    // Names begin in reading order, but WITHIN each name the letters rise in
    // RANDOM order with random delays — like the single-name animation — so it
    // drifts up organically instead of sweeping left-to-right.
    names.forEach((n,i)=> buildNameRow(rgrid, n, i, EXEC_LEAD));
  })();

  // Size roster names so the tallest column fits the screen height, and no
  // single name overflows its column width. All names share one height.
  function fitRoster(){
    const rows = Math.ceil(names.length/2);
    const vh = window.innerHeight;
    // subtract the logo AND the exec section, then divide the rest by rows
    const logoH = document.getElementById("rlogo").offsetHeight || vh*0.14;
    const execH = document.getElementById("execwrap").offsetHeight || 0;
    const sciLabel = document.querySelector(".scilabel");
    const sciH = sciLabel ? sciLabel.offsetHeight : 0;
    const avail = vh - logoH - execH - sciH - vh*0.12;   // logo + exec + sci label + paddings
    const perRow = avail / rows;
    let h = Math.max(16, Math.floor(perRow*0.80));   // name height per row
    // width guard: measure widest name at this height, shrink if needed
    const colW = Math.min(560, rgrid.clientWidth)/2 - 12;
    const rnames=[...rgrid.querySelectorAll(".rname")];
    rnames.forEach(el=> el.style.setProperty("--rh", h+"px"));
    let maxW=0; rnames.forEach(el=>{ if(el.scrollWidth>maxW) maxW=el.scrollWidth; });
    if(maxW>colW){ h=Math.floor(h*colW/maxW); rnames.forEach(el=> el.style.setProperty("--rh", h+"px")); }

    // size exec names a touch larger, but keep them within the screen width
    const execEls=[...execgrid.querySelectorAll(".rname")];
    let eh = Math.max(h, Math.floor(perRow*1.0));
    const execColW = Math.min(560, execgrid.clientWidth)/2 - 12;
    execEls.forEach(el=> el.style.setProperty("--rh", eh+"px"));
    let emax=0; execEls.forEach(el=>{ if(el.scrollWidth>emax) emax=el.scrollWidth; });
    if(emax>execColW){ eh=Math.floor(eh*execColW/emax); execEls.forEach(el=> el.style.setProperty("--rh", eh+"px")); }
  }

  // wait for the letter images to load — but NEVER hang (timeout guard)
  const nameImgs = els.flatMap(el => [...el.querySelectorAll("img")]);
  function whenLoadedSafe(imgs, cap=2500){
    return Promise.all(imgs.map(img =>
      img.complete ? Promise.resolve()
                   : Promise.race([
                       new Promise(res => { img.onload = img.onerror = res; }),
                       sleep(cap)
                     ])));
  }

  (async function start(){
    // roster + logo use the same letter images; wait (capped) then size it
    await whenLoadedSafe([...rosterSplash.querySelectorAll("img")]);
    fitRoster();
    window.addEventListener("resize", fitRoster);
    // release the paused rise animations now that images are ready, so the
    // letter-rise and the SPLASH_HOLD timer below start together.
    rgrid.classList.remove("paused");
    execgrid.classList.remove("paused");

    // prep the cycling show in the background
    await whenLoadedSafe(nameImgs);
    fitNames();
    window.addEventListener("resize", fitNames);

    // hold the roster, then fade it out and start the show
    await sleep(SPLASH_HOLD);
    rosterSplash.classList.add("hide");
    await sleep(1000);
    rosterSplash.style.display = "none";
    loop();
  })();
</script>
</body>
</html>
