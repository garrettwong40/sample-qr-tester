<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>gcwong 🎈</title>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    background: radial-gradient(circle at 50% 30%, #1c1c1c 0%, #050505 90%);
    min-height:100dvh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    overflow:hidden; position:relative;
    padding:6vh 16px;
    font-family:system-ui,sans-serif;
  }
  .kicker{
    color:#ff9ecb; font-weight:800; letter-spacing:.15em;
    font-size:clamp(12px,3.4vw,20px);
    text-transform:uppercase; opacity:.85;
    margin-bottom:3vh; text-align:center;
    text-shadow:0 0 12px rgba(255,120,190,.4);
  }
  .stage{
    position:relative;
    height:clamp(90px,24dvh,190px);
    display:flex; align-items:center; justify-content:center;
    width:100%;
  }
  .name{
    display:flex; align-items:flex-end; justify-content:center;
    height:100%;
    filter: drop-shadow(0 14px 16px rgba(0,0,0,.5));
  }
  /* Each letter runs the SAME pure-CSS keyframe on an infinite loop.
     A per-letter animation-delay (set inline by JS) staggers them into a
     wave. Pure CSS = it can never "stall" like JS orchestration could. */
  .name img{
    display:block; height:100%; width:auto; margin:0 -0.5vw;
    transform-origin:center 55%;
    will-change: transform, opacity;
    animation: pop var(--cycle) ease-in-out infinite;
  }

  @keyframes pop{
    0%   { opacity:0; transform: translateY(150%) scale(.85); }   /* below, hidden */
    14%  { opacity:1; transform: translateY(0)    scale(1); }     /* risen */
    50%  { opacity:1; transform: translateY(-6px) scale(1); }     /* gentle float */
    60%  { opacity:1; transform: translateY(0)    scale(1.26); }  /* inflate! */
    66%  { opacity:0; transform: translateY(0)    scale(.15) rotate(12deg); } /* POP */
    100% { opacity:0; transform: translateY(150%) scale(.85); }   /* stay gone, reset */
  }

  /* sparkle particles injected at each pop (JS), pure-CSS animated */
  .spark{
    position:absolute; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #ffd6ea, #ff9ecb 55%, #f25c9c 100%);
    pointer-events:none;
    animation: fly .8s ease-out forwards;
  }
  @keyframes fly{
    0%{ transform: translate(0,0) scale(1); opacity:1; }
    100%{ transform: translate(var(--dx),var(--dy)) scale(.2); opacity:0; }
  }

  .tag{
    margin-top:5vh; text-align:center;
    color:#ffd6ea; font-weight:800;
    font-size:clamp(14px,3.6vw,22px);
    opacity:.95;
    text-shadow:0 0 14px rgba(255,120,190,.45);
  }
</style>
</head>
<body>
  <div class="kicker">AMPS Science</div>
  <div class="stage"><div class="name" id="name"></div></div>
  <div class="tag">🎈 gcwong 🎈</div>

<script>
  const NAME  = "gcwong";
  const DIR   = "../../letters/";
  const CYCLE = 6;                 // seconds per full rise->pop->reset loop
  const STAGGER = 0.28;            // seconds between letters (the wave)

  const nameEl = document.getElementById("name");

  // build letters; each gets the shared keyframe + a staggered NEGATIVE delay
  // so the wave is already in motion on load (no dead time at start).
  const letters = [...NAME.toUpperCase()];
  const imgs = letters.map((ch,i)=>{
    const im=document.createElement("img");
    im.src=DIR+ch+".png"; im.alt=ch;
    im.style.setProperty("--cycle", CYCLE+"s");
    im.style.animationDelay = (i*STAGGER)+"s";
    nameEl.appendChild(im);
    return im;
  });

  // sparkle burst when a letter hits its pop moment
  function spark(im){
    const r=im.getBoundingClientRect();
    if(!r.width) return;
    const cx=r.left+r.width/2, cy=r.top+r.height/2, size=r.height;
    for(let k=0;k<12;k++){
      const s=document.createElement("div"); s.className="spark";
      const d=size*(0.14+Math.random()*0.22);
      s.style.width=s.style.height=d+"px";
      s.style.left=(cx-d/2)+"px"; s.style.top=(cy-d/2)+"px";
      const ang=Math.random()*Math.PI*2, dist=size*(0.5+Math.random()*0.9);
      s.style.setProperty("--dx",(Math.cos(ang)*dist)+"px");
      s.style.setProperty("--dy",(Math.sin(ang)*dist - size*0.2)+"px");
      document.body.appendChild(s);
      setTimeout(()=>s.remove(),850);
    }
  }

  // Fire sparks in sync with each letter's pop (~66% of the cycle).
  // This is decorative only — if it ever fails, the CSS pop still runs.
  const popMoment = CYCLE*0.66*1000;
  imgs.forEach((im,i)=>{
    const t0 = popMoment + i*STAGGER*1000;
    // repeat every cycle
    setTimeout(function tick(){
      spark(im);
      setTimeout(tick, CYCLE*1000);
    }, t0);
  });

  // keep letters sized to fit width
  function fit(){
    const stage=nameEl.parentElement;
    const avail=stage.clientWidth*0.92, full=stage.clientHeight;
    nameEl.style.height=full+"px";
    const w=nameEl.scrollWidth;
    nameEl.style.height=(w>avail?Math.floor(full*avail/w):full)+"px";
  }
  window.addEventListener("resize", fit);
  window.addEventListener("load", fit);
  fit();
</script>
</body>
</html>
