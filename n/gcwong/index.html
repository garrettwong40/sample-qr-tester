<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>gcwong 🎈</title>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    background: radial-gradient(circle at 50% 30%, #1c1c1c 0%, #050505 90%);
    min-height:100dvh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    overflow:hidden; position:relative;
    padding:6vh 16px;
    font-family:system-ui,sans-serif;
  }
  .kicker{
    color:#ff9ecb; font-weight:800; letter-spacing:.15em;
    font-size:clamp(12px,3.4vw,20px);
    text-transform:uppercase; opacity:.85;
    margin-bottom:3vh; text-align:center;
    text-shadow:0 0 12px rgba(255,120,190,.4);
  }
  .stage{
    position:relative;
    height:clamp(90px,24dvh,190px);
    display:flex; align-items:center; justify-content:center;
    width:100%;
  }
  .name{
    display:flex; align-items:flex-end; justify-content:center;
    height:100%;
    filter: drop-shadow(0 14px 16px rgba(0,0,0,.5));
  }
  .name img{
    display:block; height:100%; width:auto; margin:0 -0.5vw;
    transform-origin:center 60%;
    will-change: transform, opacity;
    /* NOTE: visible by default. JS hides them only once it's ready to
       animate, so if the script ever stalls the name still shows. */
  }
  .bit{
    position:absolute; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #ffd6ea, #ff9ecb 55%, #f25c9c 100%);
    pointer-events:none; will-change: transform, opacity;
  }
  .tag{
    margin-top:5vh; text-align:center;
    color:#ffd6ea; font-weight:800;
    font-size:clamp(14px,3.6vw,22px);
    opacity:0; transition: opacity .8s ease;
    text-shadow:0 0 14px rgba(255,120,190,.45);
  }
  .tag.show{ opacity:.95; }
</style>
</head>
<body>
  <div class="kicker">AMPS Science</div>
  <div class="stage"><div class="name" id="name"></div></div>
  <div class="tag" id="tag">🎈 gcwong 🎈</div>

<script>
  const NAME = "gcwong";
  const DIR  = "../../letters/";

  const stage  = document.getElementById("stage");
  const nameEl = document.getElementById("name");
  const tag    = document.getElementById("tag");

  const rand  = (a,b)=>a+Math.random()*(b-a);
  const sleep = ms=>new Promise(r=>setTimeout(r,ms));

  // build letters
  const imgs = [...NAME.toUpperCase()].map(ch=>{
    const im=document.createElement("img");
    im.src=DIR+ch+".png"; im.alt=ch;
    nameEl.appendChild(im);
    return im;
  });

  function fit(){
    const avail=stage.clientWidth*0.9, full=stage.clientHeight;
    nameEl.style.height=full+"px";
    const w=nameEl.scrollWidth;
    nameEl.style.height=(w>avail?Math.floor(full*avail/w):full)+"px";
  }

  function burst(cx,cy,size){
    for(let i=0;i<14;i++){
      const b=document.createElement("div"); b.className="bit";
      const d=rand(size*0.18,size*0.42);
      b.style.width=b.style.height=d+"px";
      b.style.left=(cx-d/2)+"px"; b.style.top=(cy-d/2)+"px";
      document.body.appendChild(b);
      const ang=rand(0,Math.PI*2), dist=rand(size*0.5,size*1.3);
      const dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist-size*0.3;
      b.animate(
        [{transform:"translate(0,0) scale(1)",opacity:1},
         {transform:`translate(${dx}px,${dy}px) scale(.2)`,opacity:0}],
        {duration:rand(600,950),easing:"cubic-bezier(.2,.7,.3,1)",fill:"forwards"});
      setTimeout(()=>b.remove(),1000);
    }
  }

  async function popLetter(im){
    const r=im.getBoundingClientRect();
    im.style.transition="transform .18s ease-out";
    im.style.transform="scale(1.28)";
    await sleep(160);
    burst(r.left+r.width/2, r.top+r.height/2, r.height);
    im.style.transition="transform .12s ease-in, opacity .12s ease-in";
    im.style.transform="scale(.2) rotate("+rand(-20,20)+"deg)";
    im.style.opacity="0";
    await sleep(130);
  }

  async function play(){
    // reset -> hidden below
    imgs.forEach(im=>{ im.style.transition="none"; im.style.opacity="0"; im.style.transform="translateY(140%)"; });
    tag.classList.remove("show");
    void nameEl.offsetWidth;

    // rise in
    imgs.forEach((im,i)=>{
      im.style.transition="opacity 900ms ease, transform 1600ms cubic-bezier(.33,.15,.5,1)";
      im.style.transitionDelay=(i*130)+"ms";
      im.style.opacity="1"; im.style.transform="translateY(0)";
    });
    await sleep(imgs.length*130+1700);
    await sleep(900);

    // pop each
    for(const im of imgs){ await popLetter(im); await sleep(120); }

    tag.classList.add("show");
    await sleep(2600);
    tag.classList.remove("show");
    await sleep(700);
    play();
  }

  // Preload images but NEVER hang: race each against a 2.5s timeout.
  function whenLoadedSafe(list, cap=2500){
    return Promise.all(list.map(im=>{
      if(im.complete) return Promise.resolve();
      return Promise.race([
        new Promise(res=>{ im.onload=im.onerror=res; }),
        sleep(cap)
      ]);
    }));
  }

  (async function(){
    try{
      await whenLoadedSafe(imgs);
      fit();
      window.addEventListener("resize", fit);
      await sleep(300);
      play();
    }catch(e){
      // last-resort: if anything throws, at least show the name statically
      fit();
      imgs.forEach(im=>{ im.style.opacity="1"; im.style.transform="translateY(0)"; });
    }
  })();
</script>
</body>
</html>
