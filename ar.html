<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>AMPS Science — Selfie</title>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; overflow:hidden; background:#000; }
  body{ font-family:system-ui,sans-serif; color:#fff; }

  /* Fullscreen camera feed */
  #cam{
    position:fixed; inset:0; width:100%; height:100%;
    object-fit:cover; z-index:0; background:#000;
  }
  #cam.mirror{ transform:scaleX(-1); }   /* selfie = mirrored, like a mirror */

  /* The photo-booth frame: title pinned top, motto pinned bottom, middle clear */
  #frame{
    position:fixed; inset:0; z-index:1;
    display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    padding: calc(18px + env(safe-area-inset-top)) 12px calc(96px + env(safe-area-inset-bottom));
    pointer-events:none;   /* let touches fall through to buttons */
  }

  /* ---- balloon-letter title (reuses the team's letter PNGs) ---- */
  #title{
    display:flex; flex-direction:column; align-items:center; gap:0.6vh;
    filter: drop-shadow(0 8px 14px rgba(0,0,0,.55));
    animation: floaty 4.5s ease-in-out infinite;
  }
  #title .word{ display:flex; align-items:flex-end; justify-content:center; }
  #title .word img{ display:block; height:100%; width:auto; margin:0 -0.6vw; }
  #title .word.amps{ height: clamp(34px, 10vw, 84px); }
  #title .word.science{ height: clamp(26px, 7.6vw, 64px); }
  @keyframes floaty{
    0%,100%{ transform: translateY(0) rotate(-.5deg); }
    50%    { transform: translateY(-10px) rotate(.5deg); }
  }

  /* ---- motto pinned to the bottom ---- */
  #motto{
    font-family:"Baloo 2","Nunito",system-ui,sans-serif;
    font-weight:800; letter-spacing:.02em;
    font-size: clamp(17px, 5.4vw, 34px);
    text-shadow:0 2px 10px rgba(0,0,0,.65), 0 0 20px rgba(0,0,0,.5);
  }
  #motto .sci{ color:#ffffff; }
  #motto .magic{ color:#ff9ecb; }

  /* ---- bottom controls ---- */
  #controls{
    position:fixed; left:0; right:0; z-index:2;
    bottom:calc(20px + env(safe-area-inset-bottom));
    display:flex; align-items:center; justify-content:center; gap:22px;
  }
  .ctl{
    appearance:none; border:0; cursor:pointer; color:#fff; font-weight:800;
    background:rgba(0,0,0,.45); backdrop-filter:blur(6px);
    width:54px; height:54px; border-radius:999px; font-size:22px;
    display:flex; align-items:center; justify-content:center;
  }
  /* big round shutter */
  #shot{
    width:74px; height:74px; border-radius:999px; cursor:pointer;
    border:5px solid rgba(255,255,255,.9);
    background:linear-gradient(178deg,#ff9ecb 0%,#f25c9c 100%);
    box-shadow:0 8px 22px rgba(242,92,156,.5);
  }

  /* ---- tap-to-start gate ---- */
  #gate{
    position:fixed; inset:0; z-index:5;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:20px; padding:28px; text-align:center;
    background: radial-gradient(circle at 50% 30%, #1c1c1c 0%, #050505 92%);
    transition:opacity .5s ease;
  }
  #gate.hide{ opacity:0; pointer-events:none; }
  #gate h1{ font-size:clamp(28px,8vw,52px); font-weight:800; color:#ff9ecb; text-shadow:0 0 18px rgba(255,120,190,.55); }
  #gate p{ max-width:360px; line-height:1.5; color:#dcdcdc; font-size:15px; }
  #gate button{
    appearance:none; border:0; cursor:pointer; font-size:19px; font-weight:800;
    padding:18px 34px; border-radius:999px; color:#3a0a22;
    background:linear-gradient(178deg,#ff9ecb 0%,#f25c9c 100%);
    box-shadow:0 10px 24px rgba(242,92,156,.4);
  }
  #gate small{ color:#8f8f8f; font-size:12px; min-height:16px; }

  /* ---- photo preview ---- */
  #photoView{
    position:fixed; inset:0; z-index:6; display:none;
    flex-direction:column; align-items:center; justify-content:center; gap:16px;
    background:rgba(0,0,0,.93); padding:24px;
  }
  #photoView.show{ display:flex; }
  #photoView img{ max-width:92%; max-height:66vh; border-radius:14px; box-shadow:0 12px 40px rgba(0,0,0,.6); }
  #photoView .row{ display:flex; gap:14px; }
  #photoView .hint{ color:#bbb; font-size:13px; text-align:center; min-height:16px; }
  .pbtn{
    appearance:none; border:0; cursor:pointer; font-size:16px; font-weight:800;
    padding:14px 24px; border-radius:999px; color:#3a0a22;
    background:linear-gradient(178deg,#ff9ecb 0%,#f25c9c 100%);
  }
  .pbtn.secondary{ background:transparent; color:#ff9ecb; border:2px solid rgba(255,158,203,.6); }

  /* shutter flash */
  #flash{ position:fixed; inset:0; z-index:7; background:#fff; opacity:0; pointer-events:none; }
  #flash.fire{ animation:flash .35s ease-out; }
  @keyframes flash{ 0%{opacity:.9;} 100%{opacity:0;} }
</style>
</head>
<body>
  <video id="cam" playsinline muted autoplay></video>

  <!-- frame overlay: title top, motto bottom, person in the middle -->
  <div id="frame">
    <div id="title">
      <div class="word amps" id="w1"></div>
      <div class="word science" id="w2"></div>
    </div>
    <div id="motto"><span class="sci">99% Science </span><span class="magic">1% Magic</span></div>
  </div>

  <!-- controls -->
  <div id="controls">
    <button class="ctl" id="flip" title="Flip camera">🔄</button>
    <button id="shot" title="Take photo"></button>
    <button class="ctl" id="close" title="Close" style="font-size:20px;">✕</button>
  </div>

  <!-- tap to start (needed for camera permission) -->
  <div id="gate">
    <h1>AMPS Science ♡</h1>
    <p>Tap to open the selfie booth — strike a pose between the balloons!</p>
    <button id="startBtn">📸 Open selfie booth</button>
    <small id="gateMsg"></small>
  </div>

  <!-- photo preview -->
  <div id="photoView">
    <img id="photoImg" alt="Your selfie" />
    <div class="row">
      <button class="pbtn" id="photoShare">Share / Save</button>
      <button class="pbtn secondary" id="photoClose">Retake</button>
    </div>
    <div class="hint" id="photoHint"></div>
  </div>

  <div id="flash"></div>

<script>
(function(){
  "use strict";

  const DIR = "letters/";
  const $ = id => document.getElementById(id);
  const camVideo = $("cam"), gate = $("gate"), photoView = $("photoView"),
        photoImg = $("photoImg"), flash = $("flash");

  // ---------- build the balloon-letter title from the PNGs ----------
  function buildWord(el, text){
    for(const ch of text.toUpperCase()){
      if(ch === " ") continue;
      const img = document.createElement("img");
      img.src = DIR + ch + ".png";
      img.alt = ch;
      img.crossOrigin = "anonymous"; // same-origin anyway; keeps canvas untainted
      el.appendChild(img);
    }
  }
  buildWord($("w1"), "AMPS");
  buildWord($("w2"), "SCIENCE");

  // ---------- camera ----------
  let camFacing = "user";   // start in selfie (front) mode
  async function startCamera(facing){
    camFacing = facing || camFacing;
    if(camVideo.srcObject){ camVideo.srcObject.getTracks().forEach(t=>t.stop()); camVideo.srcObject=null; }
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ ideal: camFacing } }, audio:false
    });
    camVideo.srcObject = stream;
    camVideo.classList.toggle("mirror", camFacing === "user");
    await camVideo.play().catch(()=>{});
  }

  let flipping = false;
  async function flipCamera(){
    if(flipping) return; flipping = true;
    try{ await startCamera(camFacing === "user" ? "environment" : "user"); }
    catch(_){ /* keep current */ }
    flipping = false;
  }

  // ---------- launch ----------
  async function launch(){
    $("gateMsg").textContent = "Requesting camera…";
    try{
      await startCamera("user");
      gate.classList.add("hide");
    }catch(err){
      $("gateMsg").textContent = "Couldn't open the camera. Check permissions and tap again.";
    }
  }

  // ---------- photo capture (camera + frame overlay + motto) ----------
  let lastBlob = null;

  function drawCover(ctx, video, W, H, mirror){
    const vw = video.videoWidth, vh = video.videoHeight;
    if(!vw || !vh){ ctx.fillStyle="#050505"; ctx.fillRect(0,0,W,H); return; }
    const scale = Math.max(W/vw, H/vh);
    const dw = vw*scale, dh = vh*scale;
    const dx = (W-dw)/2, dy = (H-dh)/2;
    ctx.save();
    if(mirror){ ctx.translate(W,0); ctx.scale(-1,1); }
    ctx.drawImage(video, dx, dy, dw, dh);
    ctx.restore();
  }

  // Composite the on-screen frame by mapping each DOM element's screen rect
  // onto the output canvas — so the photo matches exactly what the user sees.
  function drawFrame(ctx, W, H){
    const sx = W / window.innerWidth, sy = H / window.innerHeight;
    // title letters (drawn un-mirrored so text reads correctly)
    document.querySelectorAll("#title img").forEach(img=>{
      if(!img.complete || !img.naturalWidth) return;
      const r = img.getBoundingClientRect();
      ctx.drawImage(img, r.left*sx, r.top*sy, r.width*sx, r.height*sy);
    });
    // motto — redraw as two-tone text at the motto's on-screen position
    const m = $("motto").getBoundingClientRect();
    const fs = Math.round(m.height * sy * 0.82);
    ctx.save();
    ctx.font = `800 ${fs}px "Baloo 2","Nunito",system-ui,sans-serif`;
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.shadowColor = "rgba(0,0,0,.65)"; ctx.shadowBlur = fs*0.5; ctx.shadowOffsetY = fs*0.06;
    const a = "99% Science ", b = "1% Magic";
    const wA = ctx.measureText(a).width, wB = ctx.measureText(b).width;
    const cx = (m.left + m.width/2) * sx;
    const cy = (m.top + m.height/2) * sy;
    let x = cx - (wA + wB)/2;
    ctx.fillStyle = "#ffffff"; ctx.fillText(a, x, cy);
    ctx.fillStyle = "#ff9ecb"; ctx.fillText(b, x + wA, cy);
    ctx.restore();
  }

  async function takePhoto(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = Math.round(window.innerWidth * dpr);
    const H = Math.round(window.innerHeight * dpr);
    const out = document.createElement("canvas");
    out.width = W; out.height = H;
    const ctx = out.getContext("2d");

    drawCover(ctx, camVideo, W, H, camVideo.classList.contains("mirror"));
    drawFrame(ctx, W, H);

    flash.classList.remove("fire"); void flash.offsetWidth; flash.classList.add("fire");

    lastBlob = await new Promise(res => out.toBlob(res, "image/png"));
    photoImg.src = URL.createObjectURL(lastBlob);
    $("photoHint").textContent = "";
    photoView.classList.add("show");
  }

  async function sharePhoto(){
    if(!lastBlob) return;
    const file = new File([lastBlob], "amps-science-selfie.png", { type:"image/png" });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      try{ await navigator.share({ files:[file], title:"AMPS Science" }); return; }
      catch(_){ /* cancelled -> fall through to download */ }
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(lastBlob);
    a.download = "amps-science-selfie.png";
    document.body.appendChild(a); a.click(); a.remove();
    $("photoHint").textContent = "Saved to your downloads.";
  }

  function closeAll(){
    if(camVideo.srcObject){ camVideo.srcObject.getTracks().forEach(t=>t.stop()); camVideo.srcObject=null; }
    photoView.classList.remove("show");
    gate.classList.remove("hide");
    $("gateMsg").textContent = "";
  }

  // ---------- wire up ----------
  $("startBtn").addEventListener("click", launch);
  $("flip").addEventListener("click", flipCamera);
  $("shot").addEventListener("click", takePhoto);
  $("close").addEventListener("click", closeAll);
  $("photoShare").addEventListener("click", sharePhoto);
  $("photoClose").addEventListener("click", ()=> photoView.classList.remove("show"));
})();
</script>
</body>
</html>
